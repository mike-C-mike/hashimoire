<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hashimoire: a practical digital forensics and defensive security field reference.">
  <meta name="theme-color" content="#0b0f0b">
  <title>Hashimoire | Digital Forensics Field Reference</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f0b'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='43' font-family='Georgia' fill='%23c8b88a'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div id="app">Loading Hashimoire documentation…</div>
  <script>
    window.$docsify = {
      name: 'HASHIMOIRE',
      repo: 'mike-C-mike/hashimoire',
      homepage: 'home.md',
      loadSidebar: true,
      auto2top: true,
      maxLevel: 2,
      subMaxLevel: 1,
      relativePath: true,
      routerMode: 'hash',
      themeColor: '#78a65d',
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        paths: 'auto',
        placeholder: 'Search commands, playbooks, tools…',
        noData: 'No matching pages',
        depth: 4,
        hideOtherSidebarContent: false
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      themeVariables: {
        background: '#14241a',
        primaryColor: '#14241a',
        primaryTextColor: '#f4f2e8',
        primaryBorderColor: '#78a65d',
        lineColor: '#c8b88a',
        secondaryColor: '#203324',
        tertiaryColor: '#0b0f0b'
      }
    });
    window.mermaid = mermaid;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
