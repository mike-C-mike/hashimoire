<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hashimoire: a practical digital forensics and defensive security field reference.">
  <meta name="theme-color" content="#0b0f0b">
  <!-- Friendly phone home-screen experience; website still needs internet access. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hashimoire">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Hashimoire | Digital Forensics Field Reference</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/hashimoire-icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/hashimoire-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/hashimoire-180.png">
  <!-- Docsify core theme supplies the layout, sidebar, and GitHub corner positioning. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/site.css?v=20261021-folding">
</head>
<body>
  <div id="app">Loading Hashimoire documentation…</div>
  <script>
    window.$docsify = {
      name: 'HASHIMOIRE',
      repo: 'mike-C-mike/hashimoire',
      homepage: 'home.md',
      loadSidebar: true,
      auto2top: true,
      maxLevel: 2,
      subMaxLevel: 0,
      relativePath: true,
      routerMode: 'hash',
      themeColor: '#78a65d',
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        paths: 'auto',
        placeholder: 'Search commands, playbooks, tools…',
        noData: 'No matching pages',
        depth: 4,
        hideOtherSidebarContent: false
      }
    };
  </script>
  <script src="assets/sidebar-fold.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      themeVariables: {
        background: '#14241a',
        primaryColor: '#14241a',
        primaryTextColor: '#f4f2e8',
        primaryBorderColor: '#78a65d',
        lineColor: '#c8b88a',
        secondaryColor: '#203324',
        tertiaryColor: '#0b0f0b'
      }
    });
    window.mermaid = mermaid;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
